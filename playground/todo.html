<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kin — Todo Application</title>
    <meta name="description" content="Stress testing Kin's frontend architecture with a dynamic Todo application." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg:          #0d0f14;
        --surface:     #161a22;
        --surface-2:   #1f2430;
        --border:      #252b38;
        --border-hover:#353d50;
        --accent:      #5e9bff;
        --accent-glow: rgba(94, 155, 255, 0.20);
        --success:     #3dd68c;
        --success-glow:rgba(61, 214, 140, 0.18);
        --danger:      #ff5e7a;
        --danger-glow: rgba(255, 94, 122, 0.18);
        --text-1:      #e8eaf0;
        --text-2:      #8992a8;
        --text-3:      #4f576a;
        --radius:      10px;
        --radius-lg:   18px;
        --transition:  160ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text-1);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1rem 4rem;
      }

      /* Navigation */
      .nav-bar {
        display: flex;
        gap: 0.5rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px;
        margin-bottom: 2rem;
      }
      .nav-link {
        font-size: 0.78rem;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-2);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 999px;
        transition: color var(--transition), background var(--transition);
      }
      .nav-link:hover { color: var(--text-1); }
      .nav-link.active {
        color: var(--accent);
        background: rgba(94, 155, 255, 0.12);
        font-weight: 600;
      }

      /* Header */
      .page-header {
        text-align: center;
        margin-bottom: 2.5rem;
      }
      .page-header .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 14px;
        font-size: 0.72rem;
        font-family: 'JetBrains Mono', monospace;
        color: var(--success);
        letter-spacing: 0.04em;
        margin-bottom: 1rem;
      }
      .page-header .badge::before {
        content: '';
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 6px var(--success);
      }
      .page-header h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #e8eaf0 0%, #8992a8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.4rem;
      }
      .page-header p {
        color: var(--text-2);
        font-size: 0.92rem;
      }

      /* App Container */
      #todo-app {
        width: 100%;
        max-width: 500px;
      }

      .todo-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.75rem;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 20px 48px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .todo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .todo-title-heading {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text-1);
      }
      .remaining-badge {
        font-size: 0.75rem;
        font-family: 'JetBrains Mono', monospace;
        color: var(--accent);
        background: rgba(94, 155, 255, 0.10);
        border: 1px solid rgba(94, 155, 255, 0.25);
        border-radius: 999px;
        padding: 3px 10px;
      }

      /* Input Row */
      .todo-input-row {
        display: flex;
        gap: 0.6rem;
      }
      .todo-input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        color: var(--text-1);
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: border-color var(--transition), box-shadow var(--transition);
      }
      .todo-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      .todo-input::placeholder {
        color: var(--text-3);
      }
      .btn-add {
        background: var(--accent);
        color: #0b111e;
        border: none;
        border-radius: var(--radius);
        padding: 0 1.25rem;
        font-weight: 600;
        font-family: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        transition: transform var(--transition), opacity var(--transition);
      }
      .btn-add:hover { opacity: 0.92; }
      .btn-add:active { transform: scale(0.96); }

      /* Empty State */
      .todo-empty {
        text-align: center;
        padding: 2.5rem 1rem;
        color: var(--text-3);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      .empty-icon { font-size: 2rem; opacity: 0.6; }
      .todo-empty p { font-size: 0.9rem; }

      /* List */
      .todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      /* Item */
      .todo-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 0.85rem;
        transition: background var(--transition), border-color var(--transition), opacity var(--transition);
      }
      .todo-item:hover {
        border-color: var(--border-hover);
      }
      .todo-item.completed {
        opacity: 0.65;
      }
      .todo-item.completed .todo-title {
        text-decoration: line-through;
        color: var(--text-2);
      }

      /* Buttons */
      .btn-toggle {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--border-hover);
        background: transparent;
        color: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: bold;
        transition: all var(--transition);
        flex-shrink: 0;
      }
      .btn-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-toggle.checked {
        background: var(--success);
        border-color: var(--success);
        color: #0b111e;
        box-shadow: 0 0 8px var(--success-glow);
      }

      .todo-title {
        flex: 1;
        font-size: 0.95rem;
        word-break: break-word;
        transition: color var(--transition);
      }

      .btn-remove {
        background: transparent;
        border: none;
        color: var(--text-3);
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: color var(--transition), background var(--transition);
        flex-shrink: 0;
      }
      .btn-remove:hover {
        color: var(--danger);
        background: var(--danger-glow);
      }

      .page-footer {
        margin-top: 3rem;
        font-size: 0.72rem;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-3);
        text-align: center;
      }
      .page-footer a { color: var(--text-2); text-decoration: none; }
      .page-footer a:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <nav class="nav-bar">
      <a href="./index.html" class="nav-link">Counter App</a>
      <a href="./todo.html" class="nav-link active">Todo App</a>
      <a href="./account-sharing.html" class="nav-link">Account Sharing →</a>
    </nav>

    <header class="page-header">
      <div class="badge">Kin Architecture Stress Test</div>
      <h1>Kin Tasks</h1>
      <p>Fine-grained reactive lists, plain view functions, zero VDOM.</p>
    </header>

    <main id="todo-app"></main>

    <footer class="page-footer">
      <a href="https://github.com/aungsannphyo/kin-prototype" target="_blank">github.com/aungsannphyo/kin-prototype</a>
      · Public Kin API Only · No VDOM
    </footer>

    <script type="module" src="./src/todo.ts"></script>
  </body>
</html>
